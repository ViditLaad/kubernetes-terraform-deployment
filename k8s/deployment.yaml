
apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-cicd-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-cicd-demo

  template:
    metadata:
      labels:
        app: python-cicd-demo

    spec:
      containers:
        - name: python-cicd-demo
          image: ghcr.io/viditlaad/python-cicd-demo:latest

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
